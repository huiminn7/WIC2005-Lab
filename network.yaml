# network.yaml: your routed network, as data. A starting point to change into your own design.
#
#   python3 build_routed.py network.yaml      checks it, then builds it in Mininet
#   python3 make_page3.py network.yaml        checks it, then writes docs/week3/index.html
#
# Replace NNNN and every NN (see "Your addresses"). Don't put your full student ID here.
#
# Each LAN has one router (.1 on the LAN) and one host (.10).
# On each link, the first router named is .1 and the second is .2.
# This starting point is the lab's network without r3. It works, but it doesn't meet the
# assignment's requirements: that's your job.

student_id_last4: "5000"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.0.1.0/24
    router: r1
    host: h1
  - name: lan-h2
    network: 10.0.32.0/24
    router: r2
    host: h2
  - name: lan-h3
    network: 10.0.33.0/24
    router: r3
    host: h3
  - name: lan-h4
    network: 10.0.4.0/24
    router: r4
    host: h4

links:
  - [r1, r2, 10.0.12.0/30]   # r1 .1, r2 .2
  - [r2, r3, 10.0.23.0/30]   # r2 .1, r3 .2
  - [r3, r4, 10.0.34.0/30]   # r3 .1, r4 .2
  - [r1, r4, 10.0.14.0/30]   # r1 .1, r4 .2

routes:
  r1:
    - to: 10.0.32.0/23       # summary: h2's and h3's LANs, both via r2
      via: 10.0.12.2
    - to: 10.0.4.0/24
      via: 10.0.14.2
  r2:
    - to: 10.0.1.0/24
      via: 10.0.12.1
    - to: 10.0.33.0/24
      via: 10.0.23.2
    - to: 10.0.4.0/24
      via: 10.0.23.2
  r3:
    - to: 10.0.32.0/24
      via: 10.0.23.1
    - to: 10.0.1.0/24
      via: 10.0.23.1
    - to: 10.0.4.0/24
      via: 10.0.34.2
  r4:
    - to: 10.0.1.0/24
      via: 10.0.14.1
    - to: 10.0.33.0/24
      via: 10.0.34.1
    - to: 10.0.32.0/24
      via: 10.0.34.1
 