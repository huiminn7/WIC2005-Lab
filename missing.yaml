# routes.yaml: the routes from Step 4, as data. Replace every NN (see "Your addresses").
#
#   python3 routers.py --id NNNN --routes routes.yaml
#
# checks every route first, then switches forwarding on and applies them. IPv4 only.


student_id_last4: "5000"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.0.1.0/24
    router: r1
    host: h1
  - name: lan-h2
    network: 10.0.32.0/24
    router: r2
    host: h2
  - name: lan-h3
    network: 10.0.33.0/24
    router: r3
    host: h3
  - name: lan-h4
    network: 10.0.4.0/24
    router: r4
    host: h4

links:
  - [r1, r2, 10.0.12.0/30]   # r1 .1, r2 .2
  - [r2, r3, 10.0.23.0/30]   # r2 .1, r3 .2
  - [r3, r4, 10.0.34.0/30]   # r3 .1, r4 .2
  - [r1, r4, 10.0.14.0/30]   # r1 .1, r4 .2

routes:
  r1:
    - to: 10.0.32.0/23       # summary: h2's and h3's LANs, both via r2
      via: 10.0.12.2
    - to: 10.0.4.0/24
      via: 10.0.14.2
  r2:
    - to: 10.0.1.0/24
      via: 10.0.12.1
    - to: 10.0.33.0/24
      via: 10.0.23.2
    - to: 10.0.4.0/24
      via: 10.0.23.2
  r3:
    - to: 10.0.32.0/24
      via: 10.0.23.1
    - to: 10.0.1.0/24
      via: 10.0.23.1
    - to: 10.0.4.0/24
      via: 10.0.34.2
  r4:
    - to: 10.0.1.0/24
      via: 10.0.14.1
    - to: 10.0.33.0/24
      via: 10.0.34.1
    #missing route to lan-h2
    #- to: 10.0.32.0/24
    #  via: 10.0.34.1
 
